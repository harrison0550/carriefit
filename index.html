<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CarrieFit X - Phase 9 Nutrition</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><h1>🌸 CarrieFit X Nutrition</h1></header>
<main>
<section class="card">
<h2>Today's Nutrition</h2>
<div class="grid">
<div><label>Calories</label><input id="cal" type="number" value="1800"></div>
<div><label>Protein (g)</label><input id="protein" type="number" value="120"></div>
<div><label>Carbs (g)</label><input id="carbs" type="number" value="150"></div>
<div><label>Fat (g)</label><input id="fat" type="number" value="60"></div>
</div>
<button id="save">Save Daily Nutrition</button>
</section>

<section class="card">
<h2>Meal Log</h2>
<input id="meal" placeholder="Meal name">
<input id="mealcal" type="number" placeholder="Calories">
<button id="addMeal">Add Meal</button>
<ul id="meals"></ul>
</section>

<section class="card">
<h2>Hydration</h2>
<input id="water" type="range" min="0" max="16" value="8">
<p><span id="waterValue">8</span> glasses</p>
</section>
</main>
<script src="js/app.js"></script>
</body></html>

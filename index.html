<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#d94b87">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CarrieFit">
  <title>CarrieFit X — Phase 5</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">CARRIEFIT X</p>
        <h1 id="pageTitle">Home</h1>
      </div>
      <button class="icon-button" id="profileButton" aria-label="Open settings">CF</button>
    </header>

    <main id="app" class="page" aria-live="polite"></main>

    <nav class="tabbar" aria-label="Primary navigation">
      <button class="tab active" data-route="home"><span>⌂</span><small>Home</small></button>
      <button class="tab" data-route="workouts"><span>◆</span><small>Workouts</small></button>
      <button class="tab" data-route="equipment"><span>▦</span><small>Equipment</small></button>
      <button class="tab" data-route="progress"><span>↗</span><small>Progress</small></button>
      <button class="tab" data-route="wellness"><span>♥</span><small>Wellness</small></button>
    </nav>
  </div>

  <div class="timer-sheet hidden" id="timerSheet" role="dialog" aria-modal="true">
    <div class="timer-card">
      <button class="sheet-close" id="closeTimer" aria-label="Close timer">×</button>
      <p class="eyebrow">REST TIMER</p>
      <div class="timer-display" id="timerDisplay">01:30</div>
      <div class="timer-actions">
        <button class="secondary" data-seconds="60">1:00</button>
        <button class="secondary" data-seconds="90">1:30</button>
        <button class="secondary" data-seconds="120">2:00</button>
      </div>
      <button class="primary wide" id="timerToggle">Start</button>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

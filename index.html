<!doctype html><html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CarrieFit 6.0</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="manifest" href="manifest.webmanifest">
</head><body>
<header class="hero">
<h1>🌸 CarrieFit</h1>
<p id="greeting"></p>
</header>

<div class="grid">
<div class="card accent">
<h2>Today's Mission</h2>
<p>Full Body A</p>
<p>45 Minutes</p>
<button id="start">Start Workout</button>
</div>

<div class="card">
<h2>Weekly Goal</h2>
<div class="ring">0 / 5</div>
<p>Complete five workouts this week.</p>
</div>

<div class="card">
<h2>Home Gym</h2>
<div class="gallery">
<div class="photo">🏋️<br>RitFit M1</div>
<div class="photo">🏃<br>Treadmill</div>
<div class="photo">🚣<br>Rower</div>
<div class="photo">🚴<br>Bike</div>
</div>
</div>

<div class="card">
<h2>Coach's Message</h2>
<p id="coach"></p>
</div>
</div>

<nav class="tabbar">
<button class="active">🏠<span>Home</span></button>
<button>💪<span>Workouts</span></button>
<button>📈<span>Progress</span></button>
<button>❤️<span>Wellness</span></button>
<button>⚙️<span>Settings</span></button>
</nav>

<script src="js/app.js"></script>
</body></html>

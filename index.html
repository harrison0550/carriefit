<!doctype html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CarrieFit 5.1</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<header class="hero">
<h1>🌸 CarrieFit</h1>
<p id="greeting"></p>
</header>

<section class="card">
<h2>Today's Mission</h2>
<p>Full Body A • 45 Minutes</p>
<button id="startBtn">Start Workout</button>
</section>

<section class="card">
<h2>This Week</h2>
<div class="week">
<div class="day done">M</div><div class="day">T</div><div class="day">W</div><div class="day">T</div><div class="day">F</div><div class="day">S</div><div class="day">S</div>
</div>
</section>

<section class="card">
<h2>Your Equipment</h2>
<div class="equipGrid">
<button class="equip">🏋️<span>RitFit M1</span></button>
<button class="equip">🏃<span>Treadmill</span></button>
<button class="equip">🚣<span>Rower</span></button>
<button class="equip">🚴<span>Bike</span></button>
</div>
</section>

<section class="card" id="details">
<h2>Equipment Details</h2>
<p>Tap an equipment card to see setup notes.</p>
</section>

<nav class="tabbar">
<button class="active">🏠<small>Home</small></button>
<button>💪<small>Workouts</small></button>
<button>📈<small>Progress</small></button>
<button>❤️<small>Wellness</small></button>
<button>⚙️<small>Settings</small></button>
</nav>
<script src="js/app.js"></script>
</body></html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#cf4f89">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CarrieFit">
  <title>CarrieFit X — Phase 10</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">CARRIEFIT X</p>
        <h1 id="pageTitle">Today</h1>
      </div>
      <button id="settingsButton" class="avatar-button" aria-label="Open profile">CF</button>
    </header>

    <main id="app" class="page" aria-live="polite"></main>

    <nav class="tabbar" aria-label="Primary navigation">
      <button class="tab active" data-route="today"><span>⌂</span><small>Today</small></button>
      <button class="tab" data-route="workouts"><span>◆</span><small>Train</small></button>
      <button class="tab" data-route="nutrition"><span>◉</span><small>Nutrition</small></button>
      <button class="tab" data-route="progress"><span>↗</span><small>Progress</small></button>
      <button class="tab" data-route="coach"><span>✦</span><small>Coach</small></button>
    </nav>
  </div>

  <div class="sheet hidden" id="sheet">
    <div class="sheet-card" id="sheetContent"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/coach.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
